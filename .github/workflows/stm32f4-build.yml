name: STM32 Build, Flash & Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FLASH_TOOL: openocd
  SERIAL_PORT: COM5
  BAUD_RATE: 115200

jobs:
  build:
    runs-on: [self-hosted, windows]
    outputs:
      project_dir: ${{ steps.get-project.outputs.project_dir }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read PROJECT_DIR from Makefile
        id: get-project
        run: |
          for /f "tokens=*" %%a in ('make -s print-PROJECT_DIR') do (
            echo PROJECT_DIR=%%a>> %GITHUB_ENV%
            echo project_dir=%%a>> %GITHUB_OUTPUT%
          )
        shell: cmd

      - name: Build with Makefile
        run: |
          make clean
          make build
        shell: cmd

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stm32_bin
          path: ${{ env.PROJECT_DIR }}/main.bin

  flash:
    runs-on: [self-hosted, windows]
    needs: build
    env:
      PROJECT_DIR: ${{ needs.build.outputs.project_dir }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: stm32_bin
          path: ${{ env.PROJECT_DIR }}

      - name: Flash to Hardware
        run: |
          make flash FLASH_TOOL=${{ env.FLASH_TOOL }}
        shell: cmd

  verify:
    runs-on: [self-hosted, windows]
    needs: flash
    steps:
      - name: Verify UART Output
        # This script mimics your ESP32 monitor verification
        run: |
          echo "Starting UART Verification on ${{ env.SERIAL_PORT }}..."
          $port = New-Object System.IO.Ports.SerialPort ${{ env.SERIAL_PORT }}, ${{ env.BAUD_RATE }}, None, 8, one
          $port.Open()
          $startTime = Get-Date
          $output = ""
          
          # Listen for 10 seconds
          while ((Get-Date) -lt $startTime.AddSeconds(10)) {
              if ($port.BytesToRead -gt 0) {
                  $output += $port.ReadExisting()
              }
              Start-Sleep -Milliseconds 100
          }
          $port.Close()
          
          echo "Received Output:"
          echo $output
          
          # Pass if any output was received
          if ($output.Length -gt 0) {
              echo "Verification Passed! Received $($output.Length) characters."
          } else {
              echo "Verification Failed: No output received from UART."
              exit 1
          }
        shell: powershell